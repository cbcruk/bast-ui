# Decide (rather than prompt for) build scripts of dependencies. rs-module-lexer
# ships prebuilt binaries, so its build script is not needed — declining it keeps
# `pnpm install --frozen-lockfile` non-interactive and exit-0 in CI.
allowBuilds:
  rs-module-lexer: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
