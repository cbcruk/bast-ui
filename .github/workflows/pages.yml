name: Deploy demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the library
        run: pnpm exec vp pack
      - name: Assemble the static site
        run: |
          mkdir -p _site/node_modules/@microsoft
          cp -r examples _site/examples
          cp -r dist _site/dist
          cp custom-elements.json _site/custom-elements.json
          # The pages' import map resolves FAST from ../node_modules (relative),
          # so ship it alongside the demos. -L dereferences the pnpm symlink so
          # the real files are copied, not a dangling link.
          cp -rL node_modules/@microsoft/fast-element _site/node_modules/@microsoft/fast-element
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=examples/" />' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
